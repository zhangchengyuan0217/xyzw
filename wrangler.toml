name = "xyzw-web-helper"
main = "worker.js"
compatibility_date = "2026-10-29"

# Vite build output. Cloudflare Workers Builds runs `wrangler deploy` after
# the dashboard build command (`pnpm run build`) produces this directory.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API proxy in worker.js must run before static-asset matching.
run_worker_first = ["/api/*"]
