<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XYZW 助手</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        "SF Pro Display",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
      background: linear-gradient(180deg, #e7f1ff 0%, #ffffff 48%);
      min-height: 100vh;
    }

    #app {
      min-height: 100vh;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #123a6f;
      font-size: 18px;
    }

    html.loading-dark body {
      background: linear-gradient(135deg, #0f172a 0%, #1f2937 100%);
    }

    html.loading-dark .loading {
      color: #ffffff;
    }
  </style>
  <script>
    try {
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("loading-dark");
      }
    } catch (e) {}
  </script>
</head>

<body>
  <div id="app">
    <div class="loading">正在加载应用...</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
